<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 28" width="100%" height="28" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .chevron {
      fill: #D97706;
      font: 600 15px "JetBrains Mono", "Fira Code", "IBM Plex Mono", ui-monospace, monospace;
    }
    .cursor {
      fill: #D97706;
      animation: blink 1s steps(1, end) infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <text x="0" y="19" class="chevron">&gt;</text>
  <rect class="cursor" x="16" y="8" width="8" height="14"/>
  <rect x="40" y="13" width="440" height="1.5" fill="url(#lineFade)"/>
</svg>
